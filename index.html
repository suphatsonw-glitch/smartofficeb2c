  <nav class="tabs" id="tabs" hidden>
    <button type="button" class="tab" data-act="go" data-v="pr">📝 ใบขอซื้อ</button>
    <button type="button" class="tab" data-act="go" data-v="hist">🗂️ ประวัติ</button>
    <button type="button" class="tab" data-act="go" data-v="db">📚 ฐานอุปกรณ์</button>
  </nav>
  <main class="view" id="view"></main>
  <footer class="dock" id="dock" hidden></footer>
</div>
<div class="toast" id="toast"></div>
<script>
(function () {
  'use strict'
  const CFG = window.APP_CONFIG
  const $ = (s, r) => (r || document).querySelector(s)
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  const pad = (n) => (n < 10 ? '0' : '') + n
  const todayKey = (d) => { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) }
  const dTH = (k) => { const p = String(k || '').split('-'); return p.length === 3 ? Number(p[2]) + '/' + Number(p[1]) + '/' + (Number(p[0]) + 543) : '' }
  const fmtNum = (n) => (Math.round(Number(n) * 1000) / 1000).toLocaleString('en-US', { maximumFractionDigits: 3 })
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7)
  const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v) } catch (e) { return d } }
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) { toast('พื้นที่ในเครื่องเต็ม', 'err') } }
  const K = { session: 'of_session', prods: 'of_prods', draft: (b) => 'of_draft_' + b, hist: (b) => 'of_hist_' + b, settings: 'of_settings' }
  const BR = CFG.BRANCHES
  const branchById = (id) => BR.find((b) => b.id === id)
  let SESSION = null, view = 'login'
  let toastT = null
  function toast(m, type, ms) { const t = $('#toast'); t.textContent = m; t.className = 'toast on' + (type === 'err' ? ' err' : ''); clearTimeout(toastT); toastT = setTimeout(() => { t.className = 'toast' }, ms || 2400) }

  /* ---------- รูปในเครื่อง (IndexedDB) ---------- */
  const IDB = {
    db: null,
    open() { if (this.db) return Promise.resolve(this.db); return new Promise((res, rej) => { const r = indexedDB.open('office_imgs', 1); r.onupgradeneeded = () => r.result.createObjectStore('img'); r.onsuccess = () => { this.db = r.result; res(this.db) }; r.onerror = () => rej(r.error) }) },
    async put(k, v) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('img', 'readwrite'); t.objectStore('img').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error) }) },
    async get(k) { const db = await this.open(); return new Promise((res) => { const r = db.transaction('img').objectStore('img').get(k); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null) }) },
    async del(k) { const db = await this.open(); return new Promise((res) => { const t = db.transaction('img', 'readwrite'); t.objectStore('img').delete(k); t.oncomplete = () => res(); t.onerror = () => res() }) }
  }
  // ย่อรูปให้ไม่เกิน 1400px (คงอัตราส่วนเดิม) เก็บเป็น JPEG
  function compressImage(file, max, q) {
    max = max || 1400; q = q || 0.82
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file), img = new Image()
      img.onload = () => {
        let w = img.naturalWidth, h = img.naturalHeight
        const s = Math.min(1, max / Math.max(w, h)); w = Math.round(w * s); h = Math.round(h * s)
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h
        const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(img, 0, 0, w, h)
        URL.revokeObjectURL(url)
        res(cv.toDataURL('image/jpeg', q))
      }
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('เปิดรูปไม่ได้')) }
      img.src = url
    })
  }
  async function imgSrc(im) {
    if (im.lid) { const d = await IDB.get('l:' + im.lid); if (d) return d }
    if (im.fid) {
      let d = await IDB.get('f:' + im.fid)
      if (d) return d
      try { d = (await api('officeImage', { id: im.fid })).data; if (d) { await IDB.put('f:' + im.fid, d); return d } } catch (e) { /* ไม่มีเน็ต */ }
    }
    return ''
  }

  /* ---------- API ---------- */
  async function api(action, body) {
    if (!CFG.SYNC_URL) throw new Error('ยังไม่ได้ตั้งค่า SYNC_URL')
    const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null
    const tm = setTimeout(() => { if (ctrl) ctrl.abort() }, 60000)
    try {
      const res = await fetch(CFG.SYNC_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action: action, branch: SESSION ? branchById(SESSION.branchId).name : '' }, body || {})), signal: ctrl ? ctrl.signal : undefined })
      const txt = await res.text()
      let j
      try { j = JSON.parse(txt) } catch (e) { throw new Error(/<html/i.test(txt) ? 'Apps Script ตอบกลับเป็นหน้าเว็บ — ตรวจการ Deploy' : 'ข้อมูลตอบกลับผิดรูปแบบ') }
      if (!j.ok) throw new Error(j.message || j.error || 'ไม่สำเร็จ')
      return j.data || {}
    } catch (e) { throw new Error(e && e.name === 'AbortError' ? 'หมดเวลารอ' : navigator.onLine === false ? 'ไม่มีอินเทอร์เน็ต' : e.message) }
    finally { clearTimeout(tm) }
  }

  /* ---------- ฐานอุปกรณ์ ---------- */
  let PRODS = lsGet(K.prods, { rows: [], at: 0 })
  async function loadProds(quiet) {
    try { const d = await api('officeProducts'); PRODS = { rows: d.rows || [], at: Date.now() }; lsSet(K.prods, PRODS); if (view === 'db') render() }
    catch (e) { if (!quiet) toast('โหลดฐานอุปกรณ์ไม่สำเร็จ: ' + e.message, 'err', 3500) }
  }
  function searchProds(q) {
    q = String(q || '').trim().toLowerCase()
    if (!q) return PRODS.rows.slice(0, 40)
    const words = q.split(/\s+/)
    return PRODS.rows.filter((p) => { const t = (p.code + ' ' + p.name + ' ' + p.cat).toLowerCase(); return words.every((w) => t.indexOf(w) >= 0) }).slice(0, 40)
  }
  const units = () => Array.from(new Set(PRODS.rows.map((p) => p.unit).filter(Boolean).concat(['ชิ้น', 'อัน', 'ด้าม', 'กล่อง', 'แพ็ค', 'รีม', 'ม้วน', 'ขวด', 'แกลลอน', 'ห่อ', 'ชุด', 'เครื่อง']))).sort()

  /* ---------- ใบขอซื้อฉบับร่าง ---------- */
  let D = null
  function newDraft() {
    const st = lsGet(K.settings, {}) || {}
    return { id: uid(), no: '', date: todayKey(), need: '', requester: SESSION.user, purpose: st.purpose || CFG.DEFAULTS.purpose, type: st.type || CFG.DEFAULTS.type, dept: st.dept || CFG.DEFAULTS.dept, items: [], savedAt: '', dirty: false }
  }
  function loadDraft() { D = lsGet(K.draft(SESSION.branchId), null); if (!D || !D.id) { D = newDraft(); saveDraft(false) } }
  function saveDraft(dirty) { if (dirty !== false) D.dirty = true; lsSet(K.draft(SESSION.branchId), D) }

  /* ---------- Render ---------- */
  function setTop(sub, tab) {
    $('#top').hidden = view === 'login'; $('#tabs').hidden = view === 'login'
    $('#tb-s').textContent = sub || ''
    document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('on', b.dataset.v === tab))
  }
  function render() {
    if (!SESSION) view = 'login'
    if (view !== 'login') { $('#view').className = 'view'; $('#view').style.padding = '' }
    if (view === 'login') return viewLogin()
    if (view === 'hist') return viewHist()
    if (view === 'db') return viewDb()
    return viewPr()
  }
  // ----- login -----
  const lg = { pin: '', branchId: '' }
  const FRUITS = [['🥑', 'left:2%;top:3%', 1], ['🍅', 'left:0%;top:42%', 0.85], ['🥦', 'left:3%;top:78%', 0.8], ['🍊', 'right:2%;top:5%', 1], ['🍋', 'right:1%;top:46%', 0.85], ['🍇', 'right:3%;top:80%', 0.95]]
  const LEAVES = [['20%', 14, 0, 18, '🌿'], ['35%', 11, 3, 14, '🍃'], ['55%', 13, 6, 16, '🌱'], ['70%', 10, 1.5, 12, '🌿'], ['45%', 15, 4, 14, '🍃']]
  function viewLogin() {
    setTop('', '')
    $('#dock').hidden = true
    const st = lsGet(K.settings, {}) || {}
    lg.branchId = lg.branchId || st.lastBranch || ''
    lg.pin = ''
    $('#view').className = 'view login'
    $('#view').innerHTML = '<div class="login-screen">' +
      '<a class="login-home" href="https://suphatsonw-glitch.github.io/homepage/" aria-label="กลับหน้าโฮม">🏠 หน้าโฮม</a>' +
      FRUITS.map((f) => '<div class="fruit-side" style="' + f[1] + ';--k:' + f[2] + '">' + f[0] + '</div>').join('') +
      LEAVES.map((l) => '<div class="leaf" style="left:' + l[0] + ';animation-duration:' + l[1] + 's;animation-delay:' + l[2] + 's;font-size:' + l[3] + 'px">' + l[4] + '</div>').join('') +
      '<div class="login-brand"><div class="login-logo">🖇️</div><div class="b1">สั่งอุปกรณ์สำนักงาน</div><div class="b2">Purchase Request · สาขาบริษัท</div></div>' +
      '<div class="login-card"><h2>🔑 เข้าสู่ระบบสาขา</h2>' +
      '<label class="field"><span class="lbl">สาขา</span><select id="lg-branch"><option value="">— เลือกสาขา —</option>' + BR.map((b) => '<option value="' + esc(b.id) + '"' + (lg.branchId === b.id ? ' selected' : '') + '>' + esc(b.name) + '</option>').join('') + '</select></label>' +
      '<label class="field"><span class="lbl">ชื่อผู้ขอซื้อ</span><input id="lg-name" type="text" value="' + esc(st.user || '') + '" placeholder="เช่น แผน" autocomplete="off"></label>' +
      '<div class="field"><span class="lbl">รหัสยืนยันสาขา (4 หลัก)</span><div class="pin-dots" id="pin-dots">' + '<i></i>'.repeat(4) + '</div></div>' +
      '<div class="err-box" id="lg-err" hidden></div>' +
      '<div class="pin-pad">' + ['1', '2', '3', '4', '5', '6', '7', '8', '9'].map((k) => '<button type="button" class="pin-key" data-act="pin" data-k="' + k + '">' + k + '</button>').join('') +
      '<button type="button" class="pin-key fn" data-act="pin" data-k="C">ล้าง</button><button type="button" class="pin-key" data-act="pin" data-k="0">0</button><button type="button" class="pin-key fn" data-act="pin" data-k="B" aria-label="ลบ">⌫</button></div>' +
      '<button type="button" class="btn pri block" id="lg-go" data-act="login" disabled>เข้าสู่ระบบ</button></div></div>'
    $('#lg-branch').onchange = (e) => { lg.branchId = e.target.value }
    document.querySelectorAll('.fruit-side').forEach((el, i) => {
      setTimeout(() => { el.classList.add('ready'); el.style.setProperty('--fy', (Math.random() * 10 - 5).toFixed(1) + 'px'); el.style.animationDelay = (Math.random() * 1.5).toFixed(2) + 's' }, [0, 400, 800, 200, 600, 1000][i] || 0)
    })
    renderPin()
  }
  function renderPin() { document.querySelectorAll('#pin-dots i').forEach((d, i) => d.classList.toggle('on', i < lg.pin.length)); const g = $('#lg-go'); if (g) g.disabled = lg.pin.length !== 4 }
  function pinPress(k) {
    const e = $('#lg-err'); if (e) e.hidden = true
    if (k === 'C') lg.pin = ''; else if (k === 'B') lg.pin = lg.pin.slice(0, -1); else if (/^\d$/.test(k) && lg.pin.length < 4) lg.pin += k
    renderPin()
    document.querySelectorAll('.fruit-side').forEach((el) => { el.classList.add('pulse'); setTimeout(() => el.classList.remove('pulse'), 320) })
  }
  // พิมพ์รหัสจากคีย์บอร์ดคอมได้ เหมือนแอปอื่น
  document.addEventListener('keydown', (e) => {
    if (view !== 'login' || modal || e.ctrlKey || e.metaKey || e.altKey) return
    const typing = e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)
    if (/^\d$/.test(e.key) && !typing) { pinPress(e.key); e.preventDefault() }
    else if (e.key === 'Backspace' && !typing) { pinPress('B'); e.preventDefault() }
    else if (e.key === 'Enter' && lg.pin.length === 4) doLogin()
  })
  function doLogin() {
    const b = branchById($('#lg-branch').value), name = $('#lg-name').value.trim(), err = $('#lg-err')
    const fail = (m) => { err.textContent = m; err.hidden = false }
    if (!b) return fail('กรุณาเลือกสาขา')
    if (!name) return fail('กรุณาใส่ชื่อผู้ขอซื้อ')
    if (lg.pin !== String(b.pin)) { lg.pin = ''; renderPin(); const d = $('#pin-dots'); if (d) { d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake') } return fail('รหัสยืนยันของสาขา' + b.name + 'ไม่ถูกต้อง') }
    lg.pin = ''
    SESSION = { branchId: b.id, user: name, date: todayKey() }
    lsSet(K.session, SESSION)
    lsSet(K.settings, Object.assign(lsGet(K.settings, {}) || {}, { user: name, lastBranch: b.id }))
    if (window.__pushRecentName) window.__pushRecentName(b.id, name)
    $('#view').style.padding = ''
    loadDraft()
    if (!D.items.length && !D.savedAt) { D.requester = name; saveDraft(false) }
    view = 'pr'; render(); loadProds(true)
    toast('ยินดีต้อนรับ ' + name + ' · สาขา' + b.name)
  }
  // ----- ใบขอซื้อ -----
  function viewPr() {
    setTop('สาขา' + branchById(SESSION.branchId).name + ' · ' + SESSION.user, 'pr')
    const saved = !!D.savedAt && !D.dirty
    const nImg = D.items.reduce((a, x) => a + (x.imgs || []).length, 0)
    $('#view').innerHTML =
      (D.savedAt && D.dirty ? '<div class="warn">✏️ แก้ไขใบ ' + esc(D.no) + ' อยู่ — กด "บันทึก" อีกครั้งเพื่ออัปเดตในชีต</div>' : '') +
      '<div class="card"><h2>📝 ใบขอซื้อ ' + (D.no ? '<span class="badge">' + esc(D.no) + '</span>' : '<span class="badge draft">ฉบับร่าง</span>') + '</h2>' +
      '<div class="grid2"><label class="field"><span>วันที่เอกสาร</span><input type="date" data-f="date" value="' + esc(D.date) + '"></label>' +
      '<label class="field"><span>วันที่ต้องการสินค้า</span><input type="date" data-f="need" value="' + esc(D.need) + '"></label></div>' +
      '<label class="field"><span>ชื่อผู้ขอซื้อ</span><input data-f="requester" value="' + esc(D.requester) + '"></label>' +
      '<label class="field"><span>วัตถุประสงค์ซื้อ/จ้าง</span><input data-f="purpose" value="' + esc(D.purpose) + '"></label>' +
      '<div class="grid2"><label class="field"><span>ประเภท</span><input data-f="type" value="' + esc(D.type) + '"></label>' +
      '<label class="field"><span>แผนก</span><input data-f="dept" value="' + esc(D.dept) + '"></label></div>' +
      '<label class="field"><span>สาขา</span><input value="' + esc(branchById(SESSION.branchId).name) + '" readonly></label></div>' +
      '<div class="card"><h2>📦 รายการ (' + D.items.length + ')' + (nImg ? ' · 📷 ' + nImg + ' รูป' : '') + '</h2>' +
      (D.items.length ? D.items.map((x, i) =>
        '<div class="it"><div class="no">' + (i + 1) + '</div><div class="info"><div class="nm">' + esc(x.name) + '</div><div class="sub">' + esc([x.code, x.note].filter(Boolean).join(' · ')) + '</div>' +
        ((x.imgs || []).length ? '<div class="thumbs">' + x.imgs.map((im, k) => '<img data-th="' + i + '-' + k + '" alt="">').join('') + '</div>' : '') + '</div>' +
        '<div class="q">' + fmtNum(x.qty) + ' <small style="font-size:13px">' + esc(x.unit) + '</small></div>' +
        '<button type="button" class="ib" data-act="edit" data-i="' + i + '">✎</button><button type="button" class="ib" data-act="del" data-i="' + i + '">🗑</button></div>').join('')
        : '<div class="emp">ยังไม่มีรายการ — กด "➕ เพิ่มรายการ"</div>') +
      '<button type="button" class="btn pri block" data-act="add" style="margin-top:6px">➕ เพิ่มรายการ</button>' +
      (D.items.length > 20 ? '<p class="note">เกิน 20 รายการ จะพิมพ์ต่อหน้า 2 ให้อัตโนมัติ</p>' : '') + '</div>' +
      '<p class="note" style="text-align:center">** ในการขอซื้อ หากมีสเปคหรือรูปถ่ายสินค้า ต้องแนบเอกสารทุกครั้ง — แนบรูปในแต่ละรายการได้ (พิมพ์เป็นใบแนบ 4 รูป/หน้า)</p>' +
      '<p style="text-align:center;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">' + (D.savedAt ? '<button type="button" class="btn ghost" data-act="new">📄 เริ่มใบขอซื้อใหม่</button>' : '') + (D.items.length || D.need || D.savedAt ? '<button type="button" class="btn danger" data-act="clear">🧹 ล้างข้อมูลในหน้า</button>' : '') + '</p>'
    document.querySelectorAll('[data-f]').forEach((el) => { el.oninput = () => { D[el.dataset.f] = el.value; saveDraft() } })
    document.querySelectorAll('[data-th]').forEach(async (el) => { const [i, k] = el.dataset.th.split('-').map(Number); const s = await imgSrc(D.items[i].imgs[k]); if (s) el.src = s })
    const dock = $('#dock'); dock.hidden = false
    dock.innerHTML = '<button type="button" class="btn" data-act="print"' + (D.items.length ? '' : ' disabled') + '>🖨️ พิมพ์</button>' +
      '<button type="button" class="btn pri grow" data-act="save"' + (D.items.length && !saved ? '' : ' disabled') + '>' + (saved ? '✔ บันทึกแล้ว ' + esc(D.no) : '☁️ บันทึกลงชีต (' + D.items.length + ' รายการ)') + '</button>'
  }
  // ----- เพิ่ม / แก้รายการ -----
  let modal = null
  function openModal(html) { closeModal(); modal = document.createElement('div'); modal.className = 'mo'; modal.innerHTML = '<div class="ms">' + html + '</div>'; modal.addEventListener('click', (e) => { if (e.target === modal) closeModal() }); document.body.appendChild(modal); return modal.firstChild }
  function closeModal() { if (modal) { modal.remove(); modal = null } }
  // กล่องยืนยันของแอปเอง (บางเบราว์เซอร์/แอปบล็อกกล่องยืนยันของระบบ)
  function ask(title, text, okLabel, danger) {
    return new Promise((res) => {
      const ms = openModal('<h3>' + esc(title) + '</h3><p style="margin:0 0 14px;color:#35573f">' + esc(text) + '</p><div class="mact"><button type="button" class="btn" data-x="no">ยกเลิก</button><button type="button" class="btn ' + (danger ? 'danger' : 'pri') + ' grow" data-x="ok">' + esc(okLabel) + '</button></div>')
      $('[data-x=no]', ms).onclick = () => { closeModal(); res(false) }
      $('[data-x=ok]', ms).onclick = () => { closeModal(); res(true) }
      modal.addEventListener('click', (e) => { if (e.target === modal) res(false) })
    })
  }
  function openItem(idx) {
    const old = idx != null ? D.items[idx] : null
    const it = old ? JSON.parse(JSON.stringify(old)) : { key: uid(), code: '', name: '', qty: 1, unit: '', note: '', imgs: [] }
    const ms = openModal('<h3>' + (old ? '✎ แก้รายการที่ ' + (idx + 1) : '➕ เพิ่มรายการ') + '</h3>' +
      '<label class="field"><span>รายการ (พิมพ์ค้นหาจากฐาน หรือพิมพ์ชื่อเองได้)</span><input id="it-name" value="' + esc(it.name) + '" placeholder="เช่น กระดาษ A4 / ปากกา" autocomplete="off"></label>' +
      '<div class="sugg" id="it-sug" hidden></div>' +

    async function inflateRaw(bytes) {
    const ds = new DecompressionStream('deflate-raw')
    const w = ds.writable.getWriter()
    w.write(bytes); w.close()
    return new Uint8Array(await new Response(ds.readable).arrayBuffer())
  }
  function parseDelimited(text) {
    text = String(text).replace(/^﻿/, '')
    const first = text.split(/\r?\n/).find((l) => l.trim()) || ''
    const cnt = (ch) => first.split(ch).length - 1
    const d = cnt('\t') >= 1 ? '\t' : cnt(',') >= cnt(';') ? ',' : ';'
    const rows = []
    let row = [], cell = '', q = false
    for (let i = 0; i < text.length; i++) {
      const c = text[i]
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++ } else q = false } else cell += c
      } else if (c === '"') q = true
      else if (c === d) { row.push(cell); cell = '' }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = '' }
      else cell += c
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row) }
    return rows
  }
  async function readXlsx(buf) {
    if (typeof DecompressionStream === 'undefined') throw new Error('เบราว์เซอร์นี้อ่านไฟล์ Excel ตรง ๆ ไม่ได้ — ให้ Save As เป็น CSV หรือคัดลอกแล้ววางแทน')
    const u8 = new Uint8Array(buf), dv = new DataView(buf)
    let e = u8.length - 22
    while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--
    if (e < 0) throw new Error('ไฟล์ไม่ใช่ .xlsx ที่ถูกต้อง')
    const n = dv.getUint16(e + 10, true)
    let p = dv.getUint32(e + 16, true)
    const files = {}
    const dec = new TextDecoder('utf-8')
    for (let i = 0; i < n; i++) {
      const method = dv.getUint16(p + 10, true), csz = dv.getUint32(p + 20, true)
      const nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lo = dv.getUint32(p + 42, true)
      const name = dec.decode(u8.subarray(p + 46, p + 46 + nl))
      files[name] = { method: method, csz: csz, lo: lo }
      p += 46 + nl + el + cl
    }
    const get = async (name) => {
      const f = files[name]
      if (!f) return null
      const ds = f.lo + 30 + dv.getUint16(f.lo + 26, true) + dv.getUint16(f.lo + 28, true)
      const raw = u8.subarray(ds, ds + f.csz)
      return dec.decode(f.method === 0 ? raw : await inflateRaw(raw))
    }
    const xml = (t) => new DOMParser().parseFromString(t, 'application/xml')
    const sharedXml = await get('xl/sharedStrings.xml')
    const shared = sharedXml ? Array.from(xml(sharedXml).getElementsByTagName('si')).map((si) => Array.from(si.getElementsByTagName('t')).map((t) => t.textContent).join('')) : []
    let sheetPath = null
    const wb = await get('xl/workbook.xml'), rels = await get('xl/_rels/workbook.xml.rels')
    if (wb && rels) {
      const sh = xml(wb).getElementsByTagName('sheet')[0]
      const rid = sh && (sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id'))
      const rel = Array.from(xml(rels).getElementsByTagName('Relationship')).find((r) => r.getAttribute('Id') === rid)
      if (rel) { const t = rel.getAttribute('Target'); sheetPath = t.charAt(0) === '/' ? t.slice(1) : 'xl/' + t }
    }
    if (!sheetPath || !files[sheetPath]) sheetPath = Object.keys(files).filter((k) => /^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort()[0]
    const sx = sheetPath && (await get(sheetPath))
    if (!sx) throw new Error('ไม่พบข้อมูลในไฟล์ Excel')
    const rows = []
    Array.from(xml(sx).getElementsByTagName('row')).forEach((r) => {
      const arr = []
      Array.from(r.getElementsByTagName('c')).forEach((c) => {
        const ref = c.getAttribute('r') || ''
        const letters = ref.replace(/[0-9]/g, '')
        let ci = 0
        for (let k = 0; k < letters.length; k++) ci = ci * 26 + (letters.charCodeAt(k) - 64)
        ci -= 1
        const t = c.getAttribute('t')
        let v = ''
        if (t === 'inlineStr') v = Array.from(c.getElementsByTagName('t')).map((x) => x.textContent).join('')
        else {
          const ve = c.getElementsByTagName('v')[0]
          const raw = ve ? ve.textContent : ''
          v = t === 's' ? shared[Number(raw)] || '' : raw
        }
        if (ci >= 0) arr[ci] = v
      })
      rows.push(Array.from(arr, (x) => (x == null ? '' : x)))
    })
    return rows
  }
  async function readFile(file) {
    const buf = await file.arrayBuffer()
    if (/\.xlsx$/i.test(file.name) || new Uint8Array(buf.slice(0, 2)).join() === '80,75') return readXlsx(buf)
    if (/\.xls$/i.test(file.name)) throw new Error('ไฟล์ .xls เก่าอ่านไม่ได้ — เปิดใน Excel แล้ว Save As เป็น .xlsx หรือ CSV')
    let text
    try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf) } catch (e) { text = new TextDecoder('windows-874').decode(buf) }
    return parseDelimited(text)
  }

      }
      h += '<div class="pg"><div class="pno">หน้า ' + (p + 1) + '/' + total + '</div>' +
        '<div class="co"><b>' + esc(C.name) + '</b><br>' + esc(C.address) + '<br>' + esc(C.contact) + '</div>' +
        '<div class="ttl">ใบขอซื้อ (PURCHASE REQUEST)</div>' +
        '<div class="hd"><div><div class="ln"><span>ชื่อผู้ขอซื้อ</span><i style="flex:0.8">' + esc(pr.requester) + '</i><span>วัตถุประสงค์ซื้อ/จ้าง</span><i style="flex:1.5">' + esc(pr.purpose) + '</i></div>' +
        '<div class="row3" style="margin-top:2mm"><div class="ln"><span>ประเภท</span><i>' + esc(pr.type) + '</i></div><div class="ln"><span>แผนก</span><i>' + esc(pr.dept) + '</i></div><div class="ln"><span>สาขา</span><i>' + esc(b.name) + '</i></div></div></div>' +
        '<div><div class="ln"><span>เลขที่</span><i>' + esc(pr.no || '') + '</i></div><div class="ln"><span>วันที่เอกสาร</span><i>' + esc(dTH(pr.date)) + '</i></div><div class="ln"><span>วันที่ต้องการสินค้า</span><i>' + esc(dTH(pr.need)) + '</i></div></div></div>' +
        '<table class="f"><colgroup><col style="width:16mm"><col><col style="width:18mm"><col style="width:18mm"><col style="width:52mm"></colgroup><thead><tr><th>ลำดับที่</th><th>รายการ</th><th>จำนวน</th><th>หน่วย</th><th>หมายเหตุ</th></tr></thead><tbody>' + rows.join('') + '</tbody></table>' +
        '<div class="rem"><b>หมายเหตุ:</b> ** ในการขอซื้อ หากมีสเปคหรือรูปถ่ายสินค้า ต้องแนบเอกสารทุกครั้ง' + (photos.length ? ' — <b>แนบรูปอ้างอิง ' + photos.length + ' รูป (' + photoPages + ' หน้า)</b>' : '') + '</div>' +
        '<table class="s">' + ['ผู้จัดทำ/ผู้ขอซื้อ', 'ผู้อำนวยการแผนก/หัวหน้าแผนก', 'ผู้อำนวยการฝ่ายการเงิน', 'ฝ่ายจัดซื้อผู้รับผิดชอบ'].map((s) => '<tr><td>' + s + '</td><td></td><td class="d">วันที่ &nbsp;&nbsp;&nbsp;/&nbsp;&nbsp;&nbsp;&nbsp;/&nbsp;&nbsp;&nbsp;&nbsp;</td></tr>').join('') + '</table>' +
        '<div class="rev">' + esc(C.rev) + '</div></div>'
    }
    for (let p = 0; p < photoPages; p++) {
      const ph = photos.slice(p * 4, p * 4 + 4)
      h += '<div class="pg"><div class="phh"><div><b>ใบแนบ: รูปอ้างอิงสินค้า</b><br>ใบขอซื้อเลขที่ ' + esc(pr.no || '(ฉบับร่าง)') + ' · สาขา' + esc(b.name) + ' · วันที่ ' + esc(dTH(pr.date)) + '</div><div>หน้า ' + (formPages + p + 1) + '/' + total + '</div></div>' +
        '<div class="ph4">' + ph.map((x) => '<div class="c"><div class="im">' + (x.src ? '<img src="' + x.src + '" alt="">' : '<span style="color:#999">โหลดรูปไม่ได้</span>') + '</div><div class="cap"><b>รายการที่ ' + x.seq + '</b> — ' + esc(x.name) + (x.n > 1 ? ' (รูป ' + x.k + '/' + x.n + ')' : '') + '</div></div>').join('') + '</div></div>'
    }
    $('#pv-pages', pv).innerHTML = h
    $('.hint', pv).textContent = 'ตัวอย่าง A4 · ' + total + ' หน้า (ใบขอซื้อ ' + formPages + ' + ใบแนบรูป ' + photoPages + ') — ตรวจแล้วกด "สั่งพิมพ์" · มือถือเลือกเครื่องพิมพ์หรือบันทึกเป็น PDF ได้'
    function fit() { const w = pv.querySelector('.sc').clientWidth - 16, full = 794; pv.querySelectorAll('.pg').forEach((g) => { g.style.zoom = w < full ? String(Math.max(0.3, w / full)) : '' }) }
    fit(); window.addEventListener('resize', fit)
  }

  /* ---------- Events ---------- */
  document.addEventListener('click', async (ev) => {
    const el = ev.target.closest('[data-act]')
    if (!el) return
    const act = el.dataset.act, i = Number(el.dataset.i)
    if (act === 'pin') pinPress(el.dataset.k)
    else if (act === 'login') doLogin()
    else if (act === 'logout') { if (await ask('⏻ ออกจากระบบ', 'กลับไปหน้าเลือกสาขา — ฉบับร่างของสาขานี้ยังเก็บไว้ในเครื่อง', 'ออกจากระบบ')) { SESSION = null; D = null; HIST = null; lg.pin = ''; try { localStorage.removeItem(K.session) } catch (e) {} closeModal(); view = 'login'; render() } }
    else if (act === 'go') { view = el.dataset.v; render(); if (view === 'hist') loadHist(); if (view === 'db') loadProds(true) }
    else if (act === 'add') openItem(null)
    else if (act === 'edit') openItem(i)
    else if (act === 'del') { const x = D.items[i]; if (x && await ask('🗑 ลบรายการ', 'ลบ "' + x.name + '" ออกจากใบขอซื้อ?', 'ลบ', true)) { D.items.splice(i, 1); saveDraft(); render() } }
    else if (act === 'clear') { if (await ask('🧹 ล้างข้อมูลในหน้า', 'ล้างรายการและข้อมูลที่กรอกทั้งหมด แล้วเริ่มใบขอซื้อใหม่' + (D.savedAt ? ' (ใบ ' + D.no + ' ที่บันทึกแล้วยังอยู่ในชีตและในแท็บประวัติ)' : ' — ฉบับร่างนี้ยังไม่ได้บันทึก จะหายไป'), 'ล้างข้อมูล', true)) { D = newDraft(); saveDraft(false); render(); toast('ล้างข้อมูลแล้ว — เริ่มใบใหม่') } }
    else if (act === 'save') savePr()
    else if (act === 'print') printPr(D)
    else if (act === 'new') { if (!D.dirty || await ask('📄 เริ่มใบใหม่', 'ยังไม่ได้บันทึกการแก้ไข — เริ่มใบใหม่เลย?', 'เริ่มใบใหม่', true)) { D = newDraft(); saveDraft(false); render() } }
    else if (act === 'h-print') printPr(prFromHist((HIST || [])[i]))
    else if (act === 'h-edit' || act === 'h-copy') {
      if (D.items.length && (D.dirty || !D.savedAt) && !(await ask('มีฉบับร่างค้างอยู่', 'แทนที่ฉบับร่างในหน้าด้วยใบนี้?', 'แทนที่', true))) return
      const x = prFromHist((HIST || [])[i])
      if (act === 'h-copy') { x.id = uid(); x.no = ''; x.savedAt = ''; x.date = todayKey(); x.need = ''; x.requester = SESSION.user; x.dirty = true }
      D = x; saveDraft(act === 'h-copy'); view = 'pr'; render()
      toast(act === 'h-copy' ? 'คัดลอกเป็นใบใหม่แล้ว — แก้แล้วกดบันทึก' : 'เปิดใบ ' + D.no + ' — แก้แล้วกดบันทึกเพื่ออัปเดต')
    }
    else if (act === 'db-add') { const name = $('#db-name').value.trim(); if (!name) { toast('ใส่ชื่อรายการ', 'err'); return } dbSave([{ code: $('#db-code').value.trim(), name: name, unit: $('#db-unit').value.trim(), cat: $('#db-cat').value.trim() }]) }
    else if (act === 'db-read') { const t = $('#db-paste').value; if (!t.trim()) { toast('ยังไม่ได้วางข้อมูล', 'err'); return } showDbDraft(parseDelimited(t)) }
    else if (act === 'db-save') { if (dbDraft && dbDraft.length) dbSave(dbDraft) }
  })
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal) closeModal() })

  /* ---------- เริ่มต้น ---------- */
  const s = lsGet(K.session, null)
  if (s && s.date === todayKey() && branchById(s.branchId) && s.user) { SESSION = s; loadDraft(); view = 'pr'; loadProds(true) }
  render()
  if (window.__OF_TEST) window.__OF = { D: () => D, printPr: printPr, api: api, IDB: IDB, PRODS: () => PRODS, loadHist: loadHist, HIST: () => HIST }
})()
</script>
<script>
/* ชื่อผู้ใช้ล่าสุด สาขาละ 3 ชื่อ (ใช้ร่วมกันทุกแอปในเว็บเดียวกัน) */
(function () {
  var K = 'br_recent_names'
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c] }) }
  function load() { try { return JSON.parse(localStorage.getItem(K) || '{}') || {} } catch (e) { return {} } }
  window.__pushRecentName = function (bid, n) {
    n = String(n || '').trim()
    if (!bid || !n) return
    var m = load()
    var a = (m[bid] || []).filter(function (x) { return x !== n })
    a.unshift(n)
    m[bid] = a.slice(0, 3)
    try { localStorage.setItem(K, JSON.stringify(m)) } catch (e) {}
  }
  function draw() {
    var inp = document.getElementById('lg-name'), sel = document.getElementById('lg-branch')
    if (!inp || !sel) return
    var box = document.getElementById('lg-recent')
    if (!box) {
      box = document.createElement('div'); box.id = 'lg-recent'; box.className = 'rn-chips'
      var lab = inp.closest('label') || inp.parentNode
      lab.parentNode.insertBefore(box, lab.nextSibling)
    }
    var a = load()[sel.value] || []
    box.innerHTML = a.length ? '<span>ชื่อล่าสุด' + (sel.value ? '' : '') + ':</span>' + a.map(function (n) { return '<button type="button" class="rn-chip" data-rn="' + esc(n) + '">' + esc(n) + '</button>' }).join('') : ''
    box.hidden = !a.length
  }
  document.addEventListener('change', function (e) { if (e.target && e.target.id === 'lg-branch') setTimeout(draw, 0) })
  document.addEventListener('click', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('.rn-chip') : null
    if (!b) return
    e.preventDefault()
    var inp = document.getElementById('lg-name')
    if (inp) { inp.value = b.getAttribute('data-rn'); inp.dispatchEvent(new Event('input', { bubbles: true })) }
  }, true)
  new MutationObserver(function () { if (document.getElementById('lg-name') && !document.getElementById('lg-recent')) draw() }).observe(document.body, { childList: true, subtree: true })
  var st = document.createElement('style')
  st.textContent = '.rn-chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-4px 0 12px;font-size:13px;color:#5f7f5f;font-weight:700}.rn-chip{border:1.5px solid #b8dfc8;background:#e8f5ee;color:#145f2f;border-radius:99px;padding:5px 12px;font:inherit;font-weight:800;cursor:pointer;min-height:34px}.rn-chip:active{transform:scale(.96)}'
  document.head.appendChild(st)
})()
</script>
</body>
